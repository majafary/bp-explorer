events {
    worker_connections 1024;
}

http {
    # Proxy configuration for Structurizr
    # Strips X-Frame-Options to allow iframe embedding

    # Upstream Structurizr service (ECS service discovery)
    # In ECS, use service discovery name or internal ALB
    upstream structurizr {
        # For ECS: Replace with service discovery endpoint
        # Example: server structurizr.local:8080;
        # For docker-compose: server structurizr:8080;
        server ${STRUCTURIZR_HOST}:${STRUCTURIZR_PORT};
    }

    server {
        listen 80;
        server_name _;

        # Increase buffer sizes for large diagram responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Health check endpoint (for ALB target group)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy all other requests to Structurizr
        location / {
            # Proxy to Structurizr upstream
            proxy_pass http://structurizr;

            # Preserve original headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Strip X-Frame-Options header to allow iframe embedding
            proxy_hide_header X-Frame-Options;

            # Add permissive headers for iframe embedding
            add_header X-Frame-Options "ALLOWALL" always;

            # Enable CORS for cross-origin requests
            # In production, replace * with your actual domain
            add_header Access-Control-Allow-Origin "${CORS_ORIGIN}" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Credentials "true" always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # WebSocket support for auto-refresh (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
